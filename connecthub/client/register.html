<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register · ConnectHub</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><form id="registerForm" class="card auth-card">
  <h1>Join ConnectHub</h1>
  <div id="formError" class="hidden" style="color:var(--danger)" role="alert"></div>
  <label>Full name<input class="input" name="name" required maxlength="60"></label>
  <label>Username<input class="input" name="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" title="Letters, numbers and underscores"></label>
  <label>Email<input class="input" type="email" name="email" required></label>
  <label>Password (min 6 characters)<input class="input" type="password" name="password" required minlength="6" autocomplete="new-password"></label>
  <label>Confirm password<input class="input" type="password" name="confirmPassword" required autocomplete="new-password"></label>
  <label>Profile picture (optional)<input type="file" name="pic" accept="image/*"></label>
  <button class="btn">Create account</button>
  <p class="muted">Already registered? <a href="login.html" style="color:var(--primary)">Log in</a></p>
</form>
<script src="js/main.js"></script><script src="js/auth.js"></script></body></html>
